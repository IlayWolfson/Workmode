name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Workmode is Windows-only (pywin32, pycaw), so the tests run on Windows.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python packages
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Type check (mypy)
        run: python -m mypy focus_guard tools

      - name: Python tests
        run: python -m unittest discover -s tests -t . -v

      - name: JavaScript tests
        run: node --test extension/*.test.mjs "tests/js/*.test.mjs"
